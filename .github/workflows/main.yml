name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service -Name TermService -Force


      - name: Create RDP User
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Error "El secreto RDP_PASSWORD no está configurado."
              exit 1
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($existingUser) {

              Set-LocalUser `
                -Name "RDP" `
                -Password $securePass

          } else {

              New-LocalUser `
                -Name "RDP" `
                -Password $securePass `
                -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Write-Host "Usuario RDP configurado."


      - name: Configure Windows AutoLogon
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |

          $Winlogon = `
            "HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon"

          Set-ItemProperty `
            -Path $Winlogon `
            -Name "AutoAdminLogon" `
            -Value "1"

          Set-ItemProperty `
            -Path $Winlogon `
            -Name "DefaultUserName" `
            -Value "RDP"

          Set-ItemProperty `
            -Path $Winlogon `
            -Name "DefaultDomainName" `
            -Value $env:COMPUTERNAME

          Set-ItemProperty `
            -Path $Winlogon `
            -Name "DefaultPassword" `
            -Value $env:RDP_PASSWORD

          Write-Host "AutoLogon configurado."


      - name: Install Tailscale
        shell: powershell
        run: |

          $tsUrl = `
            "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $installerPath `
            -Force


      - name: Establish Tailscale Connection
        shell: powershell
        run: |

          & "$env:ProgramFiles\Tailscale\tailscale.exe" up `
            --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} `
            --hostname=gh-runner-$env:GITHUB_RUN_ID

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {

              $tsIP = & `
                "$env:ProgramFiles\Tailscale\tailscale.exe" `
                ip -4

              if (-not $tsIP) {
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale conectado."


      - name: Verify RDP Accessibility
        shell: powershell
        run: |

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {

              Write-Error `
                "TCP connection to RDP port 3389 failed"

              exit 1
          }

          Write-Host "RDP disponible."


      - name: Maintain Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "================================"
          Write-Host "          RDP ACCESS"
          Write-Host "================================"
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "================================"
          Write-Host ""
          Write-Host "La contraseña está configurada mediante GitHub Secrets."
          Write-Host ""

          while ($true) {

              Write-Host `
                "[$(Get-Date)] RDP Active"

              Start-Sleep -Seconds 300
          }
